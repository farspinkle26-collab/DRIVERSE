# Reusable: create an account on the (now single-step) Sign Up screen, then
# drive the customization screen (/customize-profile) it lands on — nation
# and car setup — through to a signed-in account on the garage gate
# (/select-car).
#
# Preconditions: the login screen ("WELCOME BACK") is showing.
# Env (all overridable by the caller via `runFlow: env:`):
#   NAME, EMAIL, PASSWORD  — new account credentials
#   COUNTRY                — a nation name present in constants/countries.ts
#   CAR_MAKE               — a make chip on the "Your Drive" step
#
# NOTE: signup() hits Supabase. This subflow needs a reachable (staging)
# backend and a fresh EMAIL — callers pass a timestamped address so re-runs
# never collide on an already-registered email.
#
# Customization is no longer part of the sign-up wizard itself: every
# account — email, Google or Apple — is routed to /customize-profile by
# app/index.tsx (needsProfileCustomization) once, immediately after account
# creation, before it can ever reach the garage gate.
appId: app.rork.driverse
env:
  NAME: "Maestro Driver"
  EMAIL: "maestro+seed@driverse.test"
  PASSWORD: "maestro-pw-123"
  COUNTRY: "Indonesia"
  CAR_MAKE: "Toyota"
---
- assertVisible: "WELCOME BACK"
- tapOn: "Sign Up"
- assertVisible: "Create Account"

# ── Account creation ─────────────────────────────────────────────
- tapOn: "Full Name"
- inputText: "${NAME}"
- tapOn: "Email address"
- inputText: "${EMAIL}"
- tapOn: "Password (min. 6 chars)"
- inputText: "${PASSWORD}"
- tapOn: "Confirm password"
- inputText: "${PASSWORD}"
- hideKeyboard
- tapOn:
    text: "CREATE ACCOUNT"

# signup() → success replaces to "/", which routes a fresh account straight
# to /customize-profile. Give the network call room.
- extendedWaitUntil:
    visible: "Your Nation"
    timeout: 20000

# ── Customization step 1: nation (pick from the list; GPS detect is
#    exercised separately in the onboarding failure variant) ─────
- tapOn: "Search nations"
- inputText: "${COUNTRY}"
- hideKeyboard
- tapOn: "${COUNTRY}"
- tapOn:
    text: "NEXT"

# ── Customization step 2: car make + colour (a colour is pre-selected) ──
- assertVisible: "Your Drive"
- tapOn: "${CAR_MAKE}"
- tapOn:
    text: "NEXT"

# ── Customization step 3: name the ride, then enter the garage ──
- assertVisible: "Name Your Ride"
- tapOn:
    text: "ENTER THE GARAGE"

- extendedWaitUntil:
    visible: "YOUR GARAGE"
    timeout: 20000
