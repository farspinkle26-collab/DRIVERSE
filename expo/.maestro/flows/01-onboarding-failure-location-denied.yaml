# FLOW 1 (failure variant) — Onboarding with location permission DENIED
# The "Your Nation" step (now on /customize-profile, reached right after
# account creation) offers GPS auto-detect. With location denied the app
# must degrade gracefully: show a clear inline error and leave the manual
# nation list fully usable — never crash or hang.
#
# Expected copy (customize-profile.tsx): "Location permission denied. Pick
# your nation from the list."
appId: app.rork.driverse
tags:
  - failure
  - onboarding
env:
  PASSWORD: "maestro-pw-123"
---
- launchApp:
    clearState: true
    permissions:
      location: deny
    arguments: {}

- assertVisible: "WELCOME BACK"
- tapOn: "Sign Up"
- assertVisible: "Create Account"

# Account creation, then land on /customize-profile.
- evalScript: ${output.email = 'maestro+denied' + Date.now() + '@driverse.test'}
- tapOn: "Full Name"
- inputText: "Denied Location"
- tapOn: "Email address"
- inputText: "${output.email}"
- tapOn: "Password (min. 6 chars)"
- inputText: "${PASSWORD}"
- tapOn: "Confirm password"
- inputText: "${PASSWORD}"
- hideKeyboard
- tapOn:
    text: "CREATE ACCOUNT"

# Nation step — attempt GPS detect while permission is denied.
- extendedWaitUntil:
    visible: "Your Nation"
    timeout: 20000
- tapOn: "Detect with GPS"

# Graceful failure: the exact inline error, and the manual path still works.
- extendedWaitUntil:
    visible: "Location permission denied. Pick your nation from the list."
    timeout: 10000
- assertVisible: "Search nations"
- tapOn: "Search nations"
- inputText: "Indonesia"
- hideKeyboard
- tapOn: "Indonesia"
# Proving we can still advance means the denial did not dead-end onboarding.
- assertVisible:
    text: "NEXT"
