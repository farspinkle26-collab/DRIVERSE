name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo:
    name: Expo app (Jest + RNTL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: expo
        run: bun install --frozen-lockfile

      # `npm install` failed on this repository for the whole of the launch-crash
      # investigation — first ERESOLVE, then EOVERRIDE — while every check here
      # stayed green, because everything here runs on bun. An installer that
      # errors leaves the previous `node_modules` in place, so the cloud builder
      # kept shipping a cached `expo-web-browser` 56.x through five consecutive
      # fixes that were each correct and never installed (§15).
      #
      # This step exercises the package manager the build server uses. It only
      # resolves the tree — no scripts, no artefacts — so it is fast and cannot
      # affect the bun install above.
      - name: Resolve the tree with npm too (the builder's package manager)
        working-directory: expo
        run: npm install --package-lock-only --ignore-scripts

      # A root layout that does not parse reached main and sat there through
      # four merges: nothing in CI compiled the app, and no test imports
      # `app/_layout.tsx`, so 278 green tests said nothing about whether a
      # bundle could be produced at all. These two steps are that check.
      - name: Typecheck
        working-directory: expo
        run: bun run typecheck

      # `expo-web-browser` sat at `^56.0.5` in this SDK 54 app and killed the
      # app on open, on both platforms, for three release cycles: the JS half
      # looked up a native module autolinking never built, and the lookup
      # throws. It is the same shape as the `babel-preset-expo@^57` archive
      # failure (§9) — one wrong caret, invisible to types, lint and the
      # bundler alike. This step is that check.
      - name: Check package versions against the Expo SDK
        working-directory: expo
        run: bun run check:versions

      # @rork-ai/toolkit-sdk was removed twice (§12, §18) — once by a reviewed
      # PR, once because a commit authored `Rork <agent@rork.com>` pushed
      # directly to main and brought it back along with the Metro wrapper that
      # injects a provider above AppErrorBoundary (§8). check:versions cannot
      # see it (it is not an Expo SDK package). This is the guard that can.
      - name: Check @rork-ai/toolkit-sdk has not come back
        working-directory: expo
        run: bun run check:no-rork-toolkit

      - name: Bundle for iOS (release)
        working-directory: expo
        run: bun run bundle:ios

      # Metro bundling is only half of what the store build does. Xcode then
      # compiles that bundle to Hermes bytecode, with a parser that is older
      # than Metro's and rejects syntax Babel may have left in — which is how a
      # bundle that built here still failed the archive with "private
      # properties are not supported". This step is that second compile.
      - name: Compile the bundle with Hermes (hermesc)
        working-directory: expo
        run: bun run bundle:hermes

      # The launch-safety rule (§1/§2) is "no native call at module scope on
      # anything reachable from app/_layout.tsx". It was written down and
      # broken anyway, twice, because it cannot be checked by reading the
      # source — once the offending code was injected by a Babel transformer
      # (§8), once it was a single line inside node_modules (§10). This walks
      # the built bundle's own module graph instead.
      - name: Check the launch path for module-scope native calls
        working-directory: expo
        run: bun run check:launch-path

      - name: Run unit & integration tests
        working-directory: expo
        run: bunx jest --ci --coverage

      - name: Run Supabase edge-function tests
        working-directory: expo
        run: bun test supabase/functions

  admin:
    name: Admin dashboard (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: admin
        run: bun install --frozen-lockfile

      - name: Run content-pipeline tests
        working-directory: admin
        run: bunx jest --ci --coverage
